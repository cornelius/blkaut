<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="../">
<title>pending</title>
</head>
<body>
<!-- Drives the real page in an iframe with synthetic pointer events, so the
     input handling is tested against the markup that ships rather than a copy.
     Run through tools/run-tests.sh, which supplies the file-access flag. -->
<iframe id="stage" src="index.html" width="700" height="700" style="border:0"></iframe>
<pre id="out">pending</pre>
<script>
const results = [];
let CELL = 72;

function report(text) {
  document.title = text;
  document.getElementById("out").textContent = text.split(" ;; ").join("\n");
}

window.addEventListener("load", async () => {
  const frame = document.getElementById("stage");
  const doc = frame.contentDocument;
  if (!doc) return report("FAIL ;; iframe unreadable - rerun with --allow-file-access-from-files");
  const win = frame.contentWindow;
  const field = doc.getElementById("field");
  CELL = parseFloat(win.getComputedStyle(doc.documentElement).getPropertyValue("--cell"));

  const posOf = (el) => {
    const t = el.style.transform.match(/translate\(\s*([-\d.]+)px\s*,\s*([-\d.]+)px\s*\)/);
    return t ? Math.round(+t[1] / CELL) + "," + Math.round(+t[2] / CELL) : "gone";
  };
  const blockAt = (x, y) =>
    [...field.querySelectorAll(".block:not(.leaving)")].find((el) => posOf(el) === x + "," + y);
  const centre = (el) => {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  };
  const counters = () =>
    doc.getElementById("hud-left").textContent + "/" + doc.getElementById("hud-moves").textContent;
  const expect = (name, got, want) =>
    results.push((got === want ? "PASS " : "FAIL ") + name + " [" + got + " vs " + want + "]");

  const send = (el, type, x, y, buttons) => el.dispatchEvent(
    new win.PointerEvent(type, {
      clientX: x, clientY: y, buttons: buttons || 0,
      bubbles: true, pointerId: 1, isPrimary: true,
    })
  );
  const press = (el, x, y) => send(el, "pointerdown", x, y, 1);
  const hover = (x, y) => send(field, "pointermove", x, y, 0);
  const release = (x, y) => send(field, "pointerup", x, y, 0);

  // Walk the pointer through a list of [dx, dy] legs in cells, a couple of
  // samples per cell, the way a hand moves.
  function walk(from, legs) {
    let { x, y } = from;
    for (const [dx, dy] of legs) {
      const samples = Math.max(1, Math.round((Math.abs(dx) + Math.abs(dy)) * 2));
      for (let i = 1; i <= samples; i++) {
        hover(x + (dx * CELL * i) / samples, y + (dy * CELL * i) / samples);
      }
      x += dx * CELL;
      y += dy * CELL;
    }
    return { x, y };
  }
  function gesture(el, legs) {
    const from = centre(el);
    press(el, from.x, from.y);
    const end = walk(from, legs);
    release(end.x, end.y);
  }

  /* a door of the wrong colour is not a way out */
  const green = blockAt(0, 0);
  gesture(green, [[0, -2]]);
  expect("green refused by red door", posOf(green) + " " + counters(), "0,0 8/0");

  /* a pull longer than the lane stops at the block in the way */
  const yellow = blockAt(0, 1);
  gesture(yellow, [[0, 3]]);
  expect("yellow stops against red", posOf(yellow) + " " + counters(), "0,2 8/1");

  /* down one, then left two, without letting go: one move, not two */
  const red = blockAt(4, 1);
  gesture(red, [[0, 1], [-2, 0]]);
  expect("red turns a corner in one gesture", posOf(red) + " " + counters(), "2,2 8/2");

  /* click to pick up, move with no button held, click to put down */
  const sticky = blockAt(3, 5);
  const grab = centre(sticky);
  press(sticky, grab.x, grab.y);
  release(grab.x, grab.y);
  const carried = walk(grab, [[-2, 0]]);
  expect("block follows an unpressed pointer", posOf(sticky), "1,5");
  press(sticky, carried.x, carried.y); // on the block itself, the way a hand does it
  release(carried.x, carried.y);
  expect("click puts the block down", posOf(sticky) + " " + counters(), "1,5 8/3");
  walk(carried, [[1, 0]]);
  expect("dropped block stays down", posOf(sticky) + " " + counters(), "1,5 8/3");

  /* clicking a second block hands the carry straight over to it */
  const handover = centre(sticky);
  press(sticky, handover.x, handover.y);
  release(handover.x, handover.y);
  const other = blockAt(0, 0);
  const onOther = centre(other);
  press(other, onOther.x, onOther.y);
  release(onOther.x, onOther.y);
  walk(onOther, [[0, 1]]);
  expect("carry passes to the clicked block", posOf(other) + " " + posOf(sticky), "0,1 1,5");
  press(other, onOther.x, onOther.y + CELL);
  release(onOther.x, onOther.y + CELL);
  expect("handover counted one move", counters(), "8/4");

  /* a block leaves through its own door, and undo brings it back */
  doc.getElementById("reset").click();
  gesture(blockAt(2, 0), [[4, 0]]);
  expect("blue exits right", counters(), "7/1");
  doc.getElementById("undo").click();
  expect("undo restores the block", blockAt(2, 0) ? counters() : "block missing", "8/0");

  /* stopping short of the door parks the block instead */
  const parked = blockAt(2, 0);
  gesture(parked, [[1, 0]]);
  expect("short pull parks the block", posOf(parked) + " " + counters(), "3,0 8/1");

  /* the door takes the block the moment it crosses the wall */
  doc.getElementById("reset").click();
  const nudge = blockAt(2, 0);
  const at = centre(nudge);
  press(nudge, at.x, at.y);
  walk(at, [[2, 0]]);
  expect("flush inside its door stays put", posOf(nudge) + " " + counters(), "4,0 8/0");
  hover(at.x + 2 * CELL + 1, at.y);
  expect("one pixel through the door exits", counters(), "7/1");
  const flight = nudge.getAnimations();
  expect(
    "the exit is animated, not snapped",
    String(flight.length && flight[0].effect.getTiming().duration),
    "220"
  );
  release(at.x + 2 * CELL + 1, at.y);

  /* finally, play the level the way a player would and watch it end */
  doc.getElementById("reset").click();
  const solution = await fetch("levels/level-01.solution.txt")
    .then((r) => r.text())
    .then((text) => text.split("\n")
      .map((line) => line.match(/^\s*\d+\.\s+(\S+)\s+(.+?)\s*$/))
      .filter(Boolean))
    .catch(() => []);
  if (!solution.length) {
    results.push("FAIL solution file unreadable");
  } else {
    const STEP = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
    for (const [, id, rest] of solution) {
      const el = field.querySelector('.block:not(.leaving)[data-id="' + id + '"]');
      if (!el) { results.push("FAIL playthrough lost block " + id); break; }
      const across = Math.round((el.offsetWidth + 6) / CELL);
      const down = Math.round((el.offsetHeight + 6) / CELL);
      const legs = [];
      for (const token of rest.split(/\s+/)) {
        const out = token.match(/^out-(\w+)$/);
        if (out) {
          const [dx, dy] = STEP[out[1]];
          // push far enough past the wall to be committed to the door
          legs.push([dx * (across + 1), dy * (down + 1)]);
          continue;
        }
        const leg = token.match(/^([a-z]+)(\d+)$/);
        if (leg) {
          const [dx, dy] = STEP[leg[1]];
          legs.push([dx * Number(leg[2]), dy * Number(leg[2])]);
        }
      }
      gesture(el, legs);
    }
    const overlay = doc.getElementById("won");
    expect("playthrough clears the board", counters(), "0/" + solution.length);
    expect("win overlay is on screen", win.getComputedStyle(overlay).display, "grid");
  }

  /* the win screen leads on, and the header must not move between levels */
  const chrome = () => ["undo", "reset", "hud-moves"].map((id) => {
    const r = doc.getElementById(id).getBoundingClientRect();
    return Math.round(r.left) + ":" + Math.round(r.width);
  }).join("|");
  const name = () => doc.getElementById("hud-level").textContent;

  const headerLines = () => Math.round(doc.querySelector(".hud").getBoundingClientRect().height);
  const atFirst = chrome();
  const linesFirst = headerLines();
  doc.getElementById("onward").click();
  expect("win screen leads to the next level", name() + " " + counters(), "Crosstown 13/0");
  const atSecond = chrome();

  // walk to the end and back, however many levels there are
  const shapes = new Set([atFirst, atSecond]);
  let stepped = 1;
  while (!doc.getElementById("next").disabled && stepped < 50) {
    doc.getElementById("next").click();
    stepped += 1;
    shapes.add(chrome());
  }
  expect("more than one level to reach", String(stepped > 1), "true");
  expect("last level has nowhere further", String(doc.getElementById("next").disabled), "true");
  while (!doc.getElementById("prev").disabled) doc.getElementById("prev").click();
  expect("back at the first level", name(), "First Light");
  expect("no previous level before the first", String(doc.getElementById("prev").disabled), "true");
  expect("header holds still on every level", String(shapes.size), "1");
  expect("header stays one line", String(linesFirst), "34");

  const failed = results.filter((r) => r.startsWith("FAIL")).length;
  report((failed ? "FAIL " + failed + " of " + results.length : "PASS all " + results.length)
    + " ;; " + results.join(" ;; "));
});
</script>
</body>
</html>
